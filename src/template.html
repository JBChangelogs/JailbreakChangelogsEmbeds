<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Inter:wght@500;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:jbw; src:url(jbwingdings.ttf); }
  body { margin:0; width:1920px; height:1080px; overflow:hidden; font-family:Archivo,sans-serif; background:#101014; }
  .vehicles { position:absolute; top:0; left:-40px; display:grid; grid-template-columns:repeat(25, 80px); grid-auto-rows:64px;
              place-items:center; font-family:jbw; color:#75b9f512; }
  .text { position:absolute; left:52px; top:40px; width:820px; color:#fff; text-transform:uppercase; }
  h1 { margin:0 0 30px; font-size:66px; font-weight:800; line-height:1.08; }
  p  { margin:0; font-size:26px; font-weight:500; letter-spacing:.5px; }
  .stage { position:absolute; inset:0; perspective:2200px; }
  .shot { position:absolute; left:800px; top:580px; width:1900px; border-radius:10px;
        transform-origin:0 0; transform:rotateX(42deg) rotateZ(-33deg);
        box-shadow:-30px 40px 60px #000c; outline:2px solid #ffffff14; }
  .card { position:absolute; left:52px; bottom:80px; display:flex; align-items:center; gap:52px; font-family:Inter,sans-serif; }
  .avatar { width:220px; height:220px; border-radius:40px; object-fit:cover; box-shadow:0 20px 50px #0009; }
  .name { color:#fff; font-size:72px; font-weight:800; line-height:1.1; }
  .handle { color:#9aa3b5; font-size:42px; font-weight:500; margin:6px 0 22px; }
  .pill { display:inline-block; background:#1d7cf2; color:#fff; font-size:32px; font-weight:500; padding:8px 26px; border-radius:999px; }
  /* {css} */
</style></head><body>
<div class="vehicles"></div>
<script>
  window.layoutDone = document.fonts.load('100px jbw').then(() => {
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.font = '100px jbw';
    const size = glyph => {
      const m = ctx.measureText(glyph);
      const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
      const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
      return 100 * Math.min(56 / w, 26 / h) + 'px';
    };
    let seed = {seed};
    const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const v = document.querySelector('.vehicles');
    for (let row = 0; row < 17; row++)
      for (let col = 0; col < 25; col++) {
        const span = document.createElement('span');
        if (row % 2) span.style.transform = 'translateX(40px)';
        if (random() < 0.5) {
          span.textContent = 'abcdefghijklmnopqrstuvwxyz'[Math.floor(random() * 26)];
          span.style.fontSize = size(span.textContent);
        }
        v.append(span);
      }
  });
</script>
<div class="stage"><img class="shot" src="shot.png"></div>
<div class="text"><h1>{title}</h1><p>{subtitle}</p></div>
<!-- {card} -->
</body></html>
