<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Bangers&family=Inter:wght@500;600;800&display=swap"
    rel="stylesheet">
  <style>
    @font-face {
      font-family: jbw;
      src: url(jbwingdings.ttf);
    }

    body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: Archivo, sans-serif;
      background: #101014;
    }

    .vehicles {
      position: absolute;
      top: 0;
      left: -40px;
      display: grid;
      grid-template-columns: repeat(25, 80px);
      grid-auto-rows: 64px;
      place-items: center;
      font-family: jbw;
      color: #75b9f512;
    }

    .text {
      position: absolute;
      left: 52px;
      top: 40px;
      width: 820px;
      color: #fff;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 30px;
      font-size: 66px;
      font-weight: 800;
      line-height: 1.08;
    }

    p {
      margin: 0;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: .5px;
    }

    .stage {
      position: absolute;
      inset: 0;
      perspective: 2200px;
    }

    .shot {
      position: absolute;
      left: 800px;
      top: 580px;
      width: 1900px;
      border-radius: 10px;
      transform-origin: 0 0;
      transform: rotateX(42deg) rotateZ(-33deg);
      box-shadow: -30px 40px 60px #000c;
      outline: 2px solid #ffffff14;
    }

    .card {
      position: absolute;
      left: 52px;
      bottom: 64px;
      display: flex;
      align-items: center;
      gap: 40px;
      padding: 32px 56px 32px 32px;
      box-sizing: border-box;
      max-width: 720px;
      font-family: Inter, sans-serif;
      border: 2px solid #34383d;
      border-radius: 32px;
      background: #17181d;
      box-shadow: 0 18px 60px -18px color-mix(in srgb, var(--underglow, transparent) 75%, transparent),
        0 8px 28px -10px color-mix(in srgb, var(--underglow, transparent) 45%, transparent);
    }

    .avatar {
      width: 200px;
      height: 200px;
      border-radius: 24px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .card>div {
      min-width: 0;
    }

    .name,
    .handle {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .name {
      color: #fff;
      font-size: 68px;
      font-weight: 800;
      line-height: 1.1;
    }

    .handle {
      color: #95a1b2;
      font-size: 40px;
      font-weight: 500;
      margin: 6px 0 22px;
    }

    .pill {
      display: inline-block;
      font-size: 30px;
      font-weight: 600;
      padding: 12px 22px;
      border-radius: 14px;
      border: 2px solid #ffffff26;
    }

    body:has(.trade) .stage,
    body:has(.trade) .text {
      display: none;
    }

    .trade {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 1816px;
      transform: translate(-50%, -50%) scale(var(--fit, 1));
      display: grid;
      gap: 22px;
      font-family: Bangers, sans-serif;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .side,
    .bar {
      background: #333;
      border-radius: 8px;
      box-shadow: 0 18px 50px -12px #000c;
    }

    .side {
      padding: 6px 16px 16px;
    }

    .who {
      display: flex;
      justify-content: space-between;
      padding: 0 6px 6px;
      color: #fff;
      font-size: 60px;
    }

    .who span:last-child {
      color: #7ee07e;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 14px;
    }

    .slot {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 330px;
      padding: 12px 12px 10px;
      box-sizing: border-box;
      background: #fff;
      border-radius: 8px;
      color: #111;
      min-width: 0;
    }

    .slot em {
      padding-right: 30px;
      color: #555;
      font-size: 28px;
      line-height: 1;
    }

    .slot em::after {
      content: 'i';
      position: absolute;
      right: 10px;
      top: 10px;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font: 800 19px/26px Inter, sans-serif;
      font-style: normal;
      text-transform: none;
      text-align: center;
    }

    .slot b {
      font-size: 40px;
      font-weight: 400;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .orb {
      position: relative;
      width: 160px;
      height: 160px;
      margin: auto auto 0;
      border-radius: 50%;
      background: #ccc;
    }

    .orb.red {
      background: #fd5752;
    }

    .orb.blue {
      background: #7fcefa;
    }

    .orb img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .orb span {
      position: absolute;
      left: -10px;
      bottom: -8px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .orb i {
      padding: 2px 10px;
      border: 3px solid #fff;
      border-radius: 99px;
      background: #fd5752;
      color: #fff;
      font-size: 24px;
    }

    .slot u {
      margin-top: 10px;
      text-align: center;
      text-decoration: none;
      color: #1f9e3a;
      font-size: 32px;
      white-space: nowrap;
      overflow: hidden;
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 22px;
      color: #fff;
      font-size: 44px;
    }

    .bar img {
      width: 56px;
      height: 56px;
      margin-right: 16px;
      vertical-align: middle;
      border-radius: 50%;
      background: #555;
    }

    .bar .logo {
      width: auto;
      height: 60px;
      margin: 0;
      border-radius: 0;
      background: none;
    }

    /* {css} */
  </style>
</head>

<body>
  <div class="vehicles"></div>
  <script>
    window.layoutDone = Promise.all([document.fonts.load('100px jbw'), new Promise(r => addEventListener('load', r))]).then(() => {
      const ctx = document.createElement('canvas').getContext('2d');
      ctx.font = '100px jbw';
      const size = (glyph, scale = 1) => {
        const m = ctx.measureText(glyph);
        const w = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
        const h = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
        return 100 * scale * Math.min(56 / w, 26 / h) + 'px';
      };
      let seed = Number('{seed}');
      const random = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
      const v = document.querySelector('.vehicles');
      for (let row = 0; row < 17; row++)
        for (let col = 0; col < 25; col++) {
          const span = document.createElement('span');
          if (row % 2) span.style.transform = 'translateX(40px)';
          if (random() < 0.5) {
            span.textContent = 'abcdefghijklmnopqrstuvwxyz'[Math.floor(random() * 26)];
            span.style.fontSize = size(span.textContent);
          }
          v.append(span);
        }
      const free = (x, y) => x > 30 && x < 1890 && y > 0 && y < 1080 && !document.elementFromPoint(x, y)?.closest('.shot, .text, .card');
      const pick = list => list[Math.floor(random() * list.length)];

      const letters = [
        ['..#', '..#', '..#', '#.#', '.#.'],
        ['##.', '#.#', '##.', '#.#', '##.'],
        ['.##', '#..', '#..', '#..', '.##'],
        ['#..', '#..', '#..', '#..', '###'],
      ];
      const cells = [...v.children];
      const used = new Set(), drawn = new Set();
      const around = (r, c, f) => {
        for (let dr = -1; dr <= 5; dr++)
          for (let dc = -1; dc <= 3; dc++)
            if (r + dr >= 0 && r + dr < 17 && c + dc < 25) f((r + dr) * 25 + c + dc, dr, dc);
      };
      for (const shape of letters) {
        const spots = [];
        for (let r = 0; r + 5 <= 17; r++)
          for (let c = 1; c + 3 <= 25; c++) {
            let ok = true;
            around(r, c, i => ok &&= !drawn.has(i));
            for (let dr = 0; dr < 5 && ok; dr++)
              for (let dc = 0; dc < 3 && ok; dc++) ok = free((c + dc) * 80, (r + dr) * 64 + 32);
            if (ok) spots.push([r, c]);
          }
        const spot = pick(spots);
        if (!spot) continue;
        around(...spot, (i, dr, dc) => {
          used.add(i);
          const s = cells[i];
          s.textContent = '';
          if (dr < 0 || dr > 4 || dc < 0 || dc > 2) return;
          drawn.add(i);
          s.style.transform = '';
          if (shape[dr][dc] === '#') {
            s.textContent = 'abcdefghijklmnopqrstuvwxyz'[Math.floor(random() * 26)];
            s.style.fontSize = size(s.textContent);
          }
        });
      }

      const gold = pick(cells.filter((s, i) => {
        const b = s.getBoundingClientRect();
        return s.textContent && !used.has(i) && free(b.x + b.width / 2, b.y + b.height / 2);
      }));
      if (gold && random() < 0.05) gold.style.color = '#f5c54240';
    });
  </script>
  <div class="stage"><img class="shot" src="shot.png"></div>
  <div class="text">
    <h1>{title}</h1>
    <p>{subtitle}</p>
  </div>
  <!-- {card} -->
  <script>
    window.layoutDone = Promise.all([window.layoutDone, document.fonts.load('800 68px Inter'), document.fonts.load('500 40px Inter'), document.fonts.load('40px Bangers')]).then(() => {
      const trade = document.querySelector('.trade');
      if (trade) trade.style.setProperty('--fit', Math.min(1, 1030 / trade.offsetHeight));
      for (const el of document.querySelectorAll('.name, .handle, .slot b, .slot u')) {
        let size = parseFloat(getComputedStyle(el).fontSize);
        const min = size * 0.6;
        while (el.scrollWidth > el.clientWidth && size > min) el.style.fontSize = --size + 'px';
      }
    });
  </script>
</body>

</html>
